model:
  pretrained_ckpt: "pretrained/pointsam/model.safetensors"
  freeze_encoder: true
  joint_mask_grasp: true

  patch_embed:              # must be indented under model
    in_channels: 6
    out_channels: 512  # compatible with unit3d-l
    num_patches: 1024
    patch_size: 256

  transformer:
    model_name: "eva02_large_patch14_448"
    pretrained: false

  pc_encoder:
    embed_dim: 256

  point_encoder:
    embed_dim: 256 

  mask_encoder:
    embed_dim: 256

  mask_decoder:
    transformer_dim: 256
    depth: 2
    num_heads: 8
    mlp_dim: 2048

  grasp_decoder:
    transformer_dim: 256
    depth: 2
    num_heads: 8
    mlp_dim: 2048
    num_grasp_rot_tokens: 6
    joint_mask_grasp: true

  prompt_iters: 5

training:
  batch_size: 1
  num_points: 10000
  learning_rate: 3.0e-4        # confirmed from official large.yaml
  weight_decay: 0.1            # confirmed from official large.yaml
  max_epochs: 10               # reduced from official 10000 (cloud training)
  max_grad_value: 1.0          # confirmed from official large.yaml
  gradient_accumulation_steps: 1
  mixed_precision: "fp16"      # essential for memory efficiency
  gradient_checkpointing: true
  output_dir: "checkpoints"
  log_every_n_steps: 10
  val_every_n_epochs: 5
  save_freq: 5                 # confirmed from official large.yaml

  scheduler:
    milestones: [400000, 500000]  # confirmed from official large.yaml
    warmup_iters: 3000
    warmup_factor: 0.001
    gamma: 0.1

data:
  root: "data/graspnet"
  split_file: "data/graspnet/splits.json"
  num_workers: 4

eval:
  top_k_grasps: 50
  iou_threshold: 0.25