# Modal training (paths are inside the Modal volumes, see modal_train.py).
# modal run --detach modal_train.py::train --config configs/graspnet_modal.yaml
model:
  pretrained_ckpt: "/data/pretrained/pointsam/model.safetensors"
  freeze_encoder: true
  joint_mask_grasp: true

  patch_embed:              # must be indented under model
    in_channels: 6
    out_channels: 512  # compatible with unit3d-l
    num_patches: 1024
    patch_size: 256

  transformer:
    model_name: "eva02_large_patch14_448"
    pretrained: false

  pc_encoder:
    embed_dim: 256

  point_encoder:
    embed_dim: 256 

  mask_encoder:
    embed_dim: 256

  mask_decoder:
    transformer_dim: 256
    depth: 2
    num_heads: 8
    mlp_dim: 2048

  grasp_decoder:
    transformer_dim: 256
    depth: 2
    num_heads: 8
    mlp_dim: 2048
    num_grasp_rot_tokens: 6
    joint_mask_grasp: true

  prompt_iters: 5

training:
  batch_size: 4                # A100 40 GB; lower if out of GPU memory
  num_points: 10000
  learning_rate: 3.0e-4        # confirmed from official large.yaml
  weight_decay: 0.1            # confirmed from official large.yaml
  max_epochs: 50               # LR schedule length; stop earlier with --stop_epoch
  max_grad_value: 1.0          # confirmed from official large.yaml
  gradient_accumulation_steps: 1
  mixed_precision: "fp16"      # essential for memory efficiency
  gradient_checkpointing: true
  output_dir: "/ckpt/checkpoints"
  log_every_n_steps: 10
  val_every_n_epochs: 5
  save_freq: 1                 # every epoch: credit or the 24 h limit can stop a run

  scheduler:
    milestones: [400000, 500000]  # confirmed from official large.yaml
    warmup_iters: 3000
    warmup_factor: 0.001
    gamma: 0.1

data:
  graspnet_root: "/data/graspnet"
  label_dir: "/data/graspnet_scene_labels"
  cameras: ["realsense", "kinect"]
  train_scenes: [0, 90]                  # scene ids [start, end); GraspNet train split is 0-99
  val_scenes: [90, 100]                  # held out from the train split
  frames_per_scene: 256                  # per camera, evenly spaced over the 256 frames
  fric_coef_thresh: 0.1                  # as RGBD-Matter; lower = stricter (graspnetAPI default 0.4)
  grasp_radius: 0.02                     # m, point -> nearest labelled grasp point
  sampling: "fps"                        # "random" or "fps" (voxel downsample + farthest point sampling)
  workspace_crop: true                   # crop to objects' bounding box + 2 cm (graspnet-baseline)
  voxel_size: 0.005                      # m, for sampling: "fps"
  num_workers: 10                        # Modal container has 12 CPUs
  pin_memory: true

eval:
  top_k_grasps: 50
  iou_threshold: 0.25